<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 800px; overflow: hidden; }
    body {
      font: 16px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #17191c;
      background:
        radial-gradient(900px 520px at 108% -10%, #dbe6ff 0%, rgba(219, 230, 255, 0) 62%),
        linear-gradient(165deg, #f8fafd 0%, #eef2f8 100%);
    }
    .stage {
      height: 800px;
      display: flex;
      align-items: center;
      gap: 54px;
      padding: 0 62px 0 76px;
    }
    .copy { flex: 1 1 auto; min-width: 0; }
    .eyebrow {
      display: inline-block;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2563eb;
      background: #e8efff;
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.22;
      font-weight: 680;
      letter-spacing: -0.6px;
      margin-bottom: 16px;
    }
    .desc {
      font-size: 17px;
      line-height: 1.62;
      color: #56606e;
      max-width: 470px;
      margin-bottom: 26px;
    }
    ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
    li {
      position: relative;
      padding-left: 26px;
      font-size: 15px;
      color: #2b3138;
    }
    li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 0 4px #e2eaff;
    }
    .shot { flex: 0 0 auto; display: flex; justify-content: flex-end; }
    .shot img {
      display: block;
      max-width: 620px;
      max-height: 668px;
      width: auto;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 22px 54px rgba(23, 34, 56, 0.16), 0 2px 6px rgba(23, 34, 56, 0.08);
      outline: 1px solid rgba(23, 34, 56, 0.07);
      background: #fff;
    }
    .shot.wide img { max-width: 690px; max-height: 480px; }
    .foot {
      position: absolute;
      left: 76px;
      bottom: 34px;
      font-size: 12.5px;
      color: #8a93a0;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <span class="eyebrow" id="eyebrow">Edge extension</span>
      <h1 id="title"></h1>
      <p class="desc" id="desc"></p>
      <ul id="points"></ul>
    </div>
    <div class="shot" id="shot"><img id="img" alt=""></div>
  </div>
  <div class="foot" id="foot">VideoFetch · Manifest V3 · no tracking, everything stays on your machine</div>

  <script>
    const q = new URLSearchParams(location.search);
    const put = (id, v) => { if (v) document.getElementById(id).textContent = v; };
    put('eyebrow', q.get('eyebrow'));
    put('title', q.get('t'));
    put('desc', q.get('d'));
    put('foot', q.get('foot'));
    document.getElementById('img').src = q.get('img');
    if (q.get('wide')) document.getElementById('shot').classList.add('wide');
    (q.get('b') || '').split('|').filter(Boolean).forEach((text) => {
      const li = document.createElement('li');
      li.textContent = text;
      document.getElementById('points').appendChild(li);
    });
  </script>
</body>
</html>
